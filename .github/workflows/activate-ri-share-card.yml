name: Update Activate RI Share Card

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even when the fingerprint is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: activate-ri-share-card
  cancel-in-progress: false

jobs:
  update-share-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1

      - name: Install dependencies
        run: npm ci

      - name: Regenerate share card
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            mise run assets:activate-ri-share-card -- --force
          else
            mise run assets:activate-ri-share-card
          fi

      - name: Commit updated share card
        run: |
          if git diff --quiet -- public/assets/activate-ri-2026-share-card.png public/assets/activate-ri-2026-share-card.meta.json; then
            echo "Share card is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/activate-ri-2026-share-card.png public/assets/activate-ri-2026-share-card.meta.json
          git commit -m "Update Activate RI share card"
          git push
